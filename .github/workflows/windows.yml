name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CONTENT_OPS_DATA_ROOT: ${{ runner.temp }}\content-ops-offline-data
      CONTENT_OPS_DOCUMENTS: ${{ runner.temp }}\content-ops-offline-documents
      CONTENT_OPS_ENGINE_USER_DATA: ${{ runner.temp }}\content-ops-offline-engine
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Install locked engine dependencies
        working-directory: engine/MatrixMedia
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --non-interactive
      - name: Compile Windows native protection first
        run: node scripts/build-windows-host.mjs
      - name: Prepare pinned media tools and Chrome
        shell: pwsh
        run: |
          node scripts/build-windows.mjs --prepare-tools
          if ($LASTEXITCODE -ne 0) { throw 'Media tools preparation failed' }
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome is required for offline browser fixtures' }
          "CONTENT_OPS_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Root regression suite including process and lock protection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          node scripts/run-tests.mjs 2>&1 | Tee-Object -FilePath dist/windows-root-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Root regression suite failed' }
      - name: Offline engine regression checks
        working-directory: engine/MatrixMedia
        shell: pwsh
        run: |
          $tests = @('test-account-partition.js','test-cli-login.js','test-publish-article-args.js','test-account-login-window-manager.js','test-puppeteer-cancel.js','test-pick-release-installer.js','test-publish-draft-args.js','test-sph-login-backup.js')
          foreach ($test in $tests) {
            node "scripts/$test"
            if ($LASTEXITCODE -ne 0) { throw "Engine regression failed: $test" }
          }
      - name: Build engine and complete self-contained installer
        run: |
          node scripts/build-engine.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Engine build failed' }
          node scripts/build-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install in Unicode path, launch, quit and uninstall with data preserved
        run: node scripts/windows-smoke.mjs
      - name: Package corresponding application source and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          git archive --format=zip --prefix=content-ops-assistant/ --output="dist/Content-Ops-Assistant-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed' }
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '^Content-Ops-Assistant-.*(setup\.exe|source\.zip)$' }
          $lines = foreach ($file in $files) { "$( (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($file.Name)" }
          $lines | Out-File dist/SHA256SUMS.txt -Encoding ascii
          @('Windows 10/11 x64 installer.', 'Offline regression and isolated install/start/quit/uninstall checks passed.', 'No real platform login, upload, draft or publishing acceptance was performed.', 'Unsigned installer; source and SHA-256 checksums are included.') | Out-File dist/RELEASE-NOTES.txt -Encoding utf8
      - name: Upload installer, source and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-ops-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/Content-Ops-Assistant-*-win-x64-setup.exe
            dist/Content-Ops-Assistant-*-win-x64-setup.exe.sha256
            dist/Content-Ops-Assistant-*-source.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.txt
            dist/windows-smoke.json
            dist/windows-root-tests.txt
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            dist/windows-smoke.json
            dist/windows-root-tests.txt

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: content-ops-windows-x64
          path: release
      - name: Publish verified assets without replacing existing release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          installer=(Content-Ops-Assistant-*-win-x64-setup.exe)
          version="${installer[0]#Content-Ops-Assistant-}"
          version="${version%-win-x64-setup.exe}"
          tag="v$version"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > tag.json 2>/dev/null; then
            tagged_sha=$(jq -r '.object.sha' tag.json)
            tagged_type=$(jq -r '.object.type' tag.json)
            if [[ "$tagged_type" == tag ]]; then tagged_sha=$(gh api "repos/$GH_REPO/git/tags/$tagged_sha" --jq '.object.sha'); fi
            if [[ "$tagged_sha" != "$SOURCE_SHA" ]]; then tag="v$version-windows.$RUN_NUMBER"; fi
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$SOURCE_SHA" --title "内容运营助手 $version · Windows x64" --notes-file RELEASE-NOTES.txt
          fi
          gh release view "$tag" --json assets --jq '.assets[].name' > existing-assets.txt
          for asset in Content-Ops-Assistant-*-win-x64-setup.exe Content-Ops-Assistant-*-win-x64-setup.exe.sha256 Content-Ops-Assistant-*-source.zip SHA256SUMS.txt RELEASE-NOTES.txt windows-smoke.json windows-root-tests.txt; do
            if ! grep -Fxq "$asset" existing-assets.txt; then gh release upload "$tag" "$asset"; fi
          done
          echo "Published: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
